<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码保存工具</title>
    <!-- 引入 html2canvas 库用于截图 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #808080; /* 灰色背景，模仿截图 */
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 截图区域容器 */
        #capture-area {
            background-color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px; /* 限制最大宽度 */
            box-sizing: border-box;
        }

        /* 图片样式 */
        .qr-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        /* 按钮通用样式 */
        .action-btn {
            width: 100%;
            max-width: 350px;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            color: #e74c3c; /* 红色字体 */
            background-color: #fff; /* 白色背景 */
            border: 2px solid #e74c3c; /* 红色边框 */
        }

        .action-btn:active {
            opacity: 0.7;
            background-color: #fce8e6;
        }
    </style>
</head>
<body>

    <!-- 这是将被截图保存的区域 -->
    <div id="capture-area">
        <!-- 已经替换为你提供的图片链接 -->
        <img src="https://i.postimg.cc/bJNn9WhB/qrcode-wx6b6c1b15ec6acb4e-customer-21891.jpg" alt="扫码图" class="qr-image" id="qrImg" crossorigin="anonymous">
        
        <button class="action-btn" id="btn-save">点击这里截图</button>
        <button class="action-btn" id="btn-wechat">点击这里打开微信</button>
    </div>

    <script>
        // 1. 截图保存功能
        document.getElementById('btn-save').addEventListener('click', function() {
            const element = document.getElementById('capture-area');
            const btn = this;
            
            // 更改按钮文字提示用户
            const originalText = btn.innerText;
            btn.innerText = "正在生成...";
            btn.disabled = true;

            html2canvas(element, {
                scale: 2, // 提高清晰度（2倍缩放）
                useCORS: true, // 允许跨域图片（针对网络图片）
                allowTaint: false, // 不允许污染画布，防止下载失败
                backgroundColor: "#ffffff" // 确保截图背景为白色
            }).then(canvas => {
                // 将 canvas 转换为图片 URL
                const imgData = canvas.toDataURL('image/png');
                
                // 创建一个临时的 <a> 标签来触发下载
                const link = document.createElement('a');
                link.download = '扫码图片_' + new Date().getTime() + '.png';
                link.href = imgData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 恢复按钮状态
                btn.innerText = originalText;
                btn.disabled = false;
                alert("图片已保存，请到手机相册或电脑下载文件夹查看！");
            }).catch(err => {
                console.error("截图失败:", err);
                btn.innerText = originalText;
                btn.disabled = false;
                alert("截图失败，可能是网络图片跨域限制。请尝试将图片下载到本地并替换src路径。");
            });
        });

        // 2. 打开微信功能
        document.getElementById('btn-wechat').addEventListener('click', function() {
            // 尝试唤起微信 App
            // 注意：浏览器安全限制，无法直接跳转到微信内部的“扫一扫”界面
            // 只能尝试打开微信 App，用户需手动点击右上角“+” -> 扫一扫。
            
            const weixinScheme = 'weixin://';
            
            // 检测是否为移动端
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile) {
                // 在移动端尝试跳转
                window.location.href = weixinScheme;
            } else {
                // 如果是电脑浏览器打开
                alert("请在手机端打开此页面，点击后才能唤起微信App。");
            }
        });
    </script>
</body>
</html>
