<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>微信扫码打开</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #e8f5e9 0%, #f5f7fa 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.1);
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 18px;
      background: linear-gradient(145deg, #07C160, #05a84e);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px -8px rgba(7,193,96,0.5);
    }
    .logo svg { width: 38px; height: 38px; fill: #fff; }
    h1 {
      font-size: 21px;
      font-weight: 600;
      color: #1f2e3d;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      color: #6b7a8a;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .qr-wrap {
      background: #f8fafc;
      border: 1px solid #e8eef5;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      display: inline-block;
    }
    .qr-wrap img {
      display: block;
      width: 220px;
      height: 220px;
      border-radius: 12px;
      background: #fff;
    }
    .tip {
      font-size: 14px;
      color: #3b4c5e;
      line-height: 1.7;
      background: #f0f9f3;
      border-radius: 14px;
      padding: 14px 16px;
      text-align: left;
      border-left: 4px solid #07C160;
    }
    .tip strong { color: #07C160; }
    .tip .icon {
      display: inline-block;
      margin-right: 4px;
    }
    .footer-note {
      font-size: 12px;
      color: #a0aebc;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M8.5 4C4.91 4 2 6.69 2 10c0 1.84.93 3.48 2.4 4.6-.15.72-.5 1.86-1.1 2.6-.1.12.02.29.17.26 1.17-.25 2.45-.9 3.2-1.47.57.15 1.2.24 1.83.24 3.59 0 6.5-2.69 6.5-6s-2.91-6-6.5-6zm-2.1 4.3c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm4.2 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/>
        <path d="M22 15.5c0-2.5-2.2-4.6-5-4.9v.4c0 .16-.01.32-.03.48 2.1.4 3.53 1.9 3.53 3.5 0 1.2-.8 2.3-2.1 3.1.1.45.35 1.2.8 1.7.1.1-.02.24-.14.2-.9-.2-1.9-.7-2.5-1.15-.44.12-.9.18-1.38.18-2.7 0-4.97-1.6-5.5-3.7-.2.02-.4.03-.6.03-.28 0-.55-.02-.82-.05.47 2.9 2.98 5.1 6.02 5.1.63 0 1.24-.1 1.8-.27.75.5 2 1.1 3.17 1.35.15.03.27-.14.17-.26-.6-.74-.95-1.88-1.1-2.6 1.48-1.12 2.4-2.76 2.4-4.6z"/>
      </svg>
    </div>
    <h1>微信扫码打开</h1>
    <p class="sub">用微信扫一扫下方二维码<br>即可在微信中打开该内容</p>

    <!-- 二维码：内容是您要打开的那张图片的链接 -->
    <div class="qr-wrap">
      <img 
        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fqxer.jike.love%2Fconsole%2Fupload%2FeZuYBR6VG.png%3FimageView%2Fw%2F500%2Fq%2Fh%2FExpires%2F1789459340" 
        alt="微信扫码打开"
      >
    </div>

    <div class="tip">
      <span class="icon">📱</span><strong>使用方法：</strong><br>
      1. 打开微信 → 点击右上角「+」<br>
      2. 选择「扫一扫」<br>
      3. 扫描上方二维码即可
    </div>

    <p class="footer-note">若无法扫码，可截图保存二维码后在微信中从相册识别</p>
  </div>
</body>
</html>
