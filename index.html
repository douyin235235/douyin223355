<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码工具</title>
    <!-- 引入 html2canvas 库用于截图 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* 纯白背景 */
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 截图区域容器 */
        #capture-area {
            background-color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px; /* 限制最大宽度，适合手机屏幕 */
            box-sizing: border-box;
        }

        /* 图片样式 */
        .qr-image {
            width: 100%;
            max-width: 320px; /* 限制图片最大宽度 */
            height: auto;
            display: block;
            margin-bottom: 30px; /* 图片和按钮之间的间距 */
        }

        /* 按钮通用样式 */
        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 15px 0;
            margin-bottom: 15px; /* 按钮之间的间距 */
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            color: #e74c3c; /* 红色字体 */
            background-color: #ffffff; /* 白色背景 */
            border: 1px solid #e74c3c; /* 红色边框 */
            outline: none;
            -webkit-tap-highlight-color: transparent; /* 去掉手机点击时的蓝色高亮 */
        }

        .action-btn:active {
            background-color: #fce8e6; /* 点击时稍微变灰，提升手感 */
        }
    </style>
</head>
<body>

    <!-- 这是将被截图保存的区域 -->
    <div id="capture-area">
        <!-- 请确保你的图片文件名叫 qrcode.jpg，并且和这个 html 文件放在同一个文件夹里 -->
        <img src="qrcode.jpg" alt="扫码图" class="qr-image" id="qrImg">
        
        <button class="action-btn" id="btn-save">点击这里截图</button>
        <button class="action-btn" id="btn-wechat">点击这里打开微信扫一扫</button>
    </div>

    <script>
        // 1. 截图保存功能
        document.getElementById('btn-save').addEventListener('click', function() {
            const element = document.getElementById('capture-area');
            const btn = this;
            
            // 改变按钮文字，防止用户重复点击
            const originalText = btn.innerText;
            btn.innerText = "正在生成...";
            btn.disabled = true;

            html2canvas(element, {
                scale: 2, // 提高截图清晰度
                useCORS: true, 
                backgroundColor: "#ffffff" // 强制白色背景
            }).then(canvas => {
                // 将 canvas 转换为图片 URL
                const imgData = canvas.toDataURL('image/png');
                
                // 创建临时下载链接
                const link = document.createElement('a');
                link.download = '扫码图片_' + new Date().getTime() + '.png';
                link.href = imgData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 恢复按钮状态
                btn.innerText = originalText;
                btn.disabled = false;
                alert("图片已保存！请到相册或下载文件夹查看。");
            }).catch(err => {
                console.error("截图失败:", err);
                btn.innerText = originalText;
                btn.disabled = false;
                alert("截图失败，请重试");
            });
        });

        // 2. 打开微信功能
        document.getElementById('btn-wechat').addEventListener('click', function() {
            // 尝试唤起微信 App (weixin:// 协议)
            const weixinScheme = 'weixin://';
            
            // 判断是否为手机设备
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile) {
                // 在手机端，尝试跳转
                window.location.href = weixinScheme;
                
                // 因为浏览器限制，无法直接打开微信的“扫一扫”界面，
                // 这里我们延迟一下，提示用户手动去扫一扫
                setTimeout(() => {
                    // 如果页面还在，说明可能没有成功唤起微信，或者用户停留了
                    // 不用做特别处理，用户体验上只要知道去微信就行了
                }, 2000);
            } else {
                alert("请在手机端打开此页面使用微信功能。");
            }
        });
    </script>
</body>
</html>
