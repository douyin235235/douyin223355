<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳转到微信</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 0;
            background-color: #07c160; /* 微信绿 */
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }
        .btn:active {
            background-color: #06ad56;
        }
        .note {
            font-size: 12px;
            color: #aaa;
            text-align: left;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">📱</div>
    <h1>点击下方按钮跳转</h1>
    <p>在浏览器中打开微信小程序</p>

    <!-- 核心跳转按钮 -->
    <!-- 注意：href 里的链接需要替换成你自己的 scheme 或链接 -->
    <a href="weixin://dl/business/?appid=wx64965379594ee87f&path=pages/index/index" class="btn" id="jumpBtn">
        点击跳转到微信
    </a>

    <div class="note">
        <strong>温馨提示：</strong><br>
        • <b>iOS用户</b>：点击后通常会直接弹窗询问是否打开“微信”，请选择“打开”。<br>
        • <b>安卓用户</b>：部分浏览器可能拦截，如果没有反应，请尝试用手机自带浏览器重新打开本页，或长按上方按钮选择“在微信中打开”。
    </div>
</div>

<script>
    // 解决部分安卓浏览器不识别 weixin:// 协议的问题
    document.getElementById('jumpBtn').addEventListener('click', function(e) {
        // 防止默认跳转（因为可能失败）
        e.preventDefault();
        
        var schemeUrl = this.href;
        
        // 尝试跳转
        window.location.href = schemeUrl;
        
        // 如果 1.5 秒后还在当前页面，说明跳转可能失败了
        setTimeout(function() {
            if (!document.hidden) {
                alert("如果无法跳转，请点击浏览器右上角的菜单，选择“在浏览器中打开”或“在微信中打开”。");
            }
        }, 1500);
    });
</script>

</body>
</html>
