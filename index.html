<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跳转微信 · 安全引导</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
      padding: 28px 24px 32px;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .card:active {
      transform: scale(0.99);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      background: linear-gradient(145deg, #07C160, #05a84e);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 18px -6px rgba(7, 193, 96, 0.3);
    }
    .logo svg {
      width: 44px;
      height: 44px;
      fill: white;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1f2e3d;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .subhead {
      font-size: 15px;
      color: #6b7a8a;
      margin-bottom: 24px;
      line-height: 1.5;
      padding: 0 6px;
    }
    .link-preview {
      background: #f0f4f9;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #3b4c5e;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e3e9f0;
      text-align: left;
    }
    .link-preview .icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      background: #d9e2ec;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .link-preview .url-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
      font-size: 12.5px;
      color: #2f3e4e;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px 20px;
      background: #07C160;
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 18px -6px rgba(7, 193, 96, 0.4);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      background: #06ad56;
      box-shadow: 0 4px 10px -4px rgba(7, 193, 96, 0.5);
    }
    .btn-secondary {
      background: #ffffff;
      color: #07C160;
      border: 1.5px solid #07C160;
      box-shadow: none;
      margin-top: 12px;
      font-size: 16px;
      padding: 14px 20px;
    }
    .btn-secondary:active {
      background: #e9f9f0;
    }
    .note {
      font-size: 13px;
      color: #8a9aa8;
      margin-top: 22px;
      line-height: 1.6;
      border-top: 1px solid #edf2f7;
      padding-top: 18px;
    }
    .note strong {
      color: #07C160;
      font-weight: 500;
    }
    .warn-text {
      color: #e6a23c;
      font-size: 13px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .hidden {
      display: none;
    }
    .status-msg {
      font-size: 14px;
      min-height: 22px;
      margin-top: 14px;
      color: #07C160;
      transition: all 0.2s;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 微信风格图标 -->
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M8.5 4C4.91 4 2 6.69 2 10c0 1.84.93 3.48 2.4 4.6-.15.72-.5 1.86-1.1 2.6-.1.12.02.29.17.26 1.17-.25 2.45-.9 3.2-1.47.57.15 1.2.24 1.83.24 3.59 0 6.5-2.69 6.5-6s-2.91-6-6.5-6zm-2.1 4.3c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm4.2 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/>
        <path d="M22 15.5c0-2.5-2.2-4.6-5-4.9v.4c0 .16-.01.32-.03.48 2.1.4 3.53 1.9 3.53 3.5 0 1.2-.8 2.3-2.1 3.1.1.45.35 1.2.8 1.7.1.1-.02.24-.14.2-.9-.2-1.9-.7-2.5-1.15-.44.12-.9.18-1.38.18-2.7 0-4.97-1.6-5.5-3.7-.2.02-.4.03-.6.03-.28 0-.55-.02-.82-.05.47 2.9 2.98 5.1 6.02 5.1.63 0 1.24-.1 1.8-.27.75.5 2 1.1 3.17 1.35.15.03.27-.14.17-.26-.6-.74-.95-1.88-1.1-2.6 1.48-1.12 2.4-2.76 2.4-4.6z"/>
      </svg>
    </div>
    <h1>跳转到微信打开</h1>
    <p class="subhead">点击下方按钮，在微信中打开指定页面</p>
    
    <div class="link-preview">
      <div class="icon">🔗</div>
      <div class="url-text" id="previewUrl">https://qxer.jike.love/console/upload/eZuYBR6VG.png</div>
    </div>

    <!-- 主按钮：直接跳转（尝试微信scheme + 备用链接） -->
    <button class="btn" id="jumpBtn">👉 在微信中打开</button>
    
    <!-- 辅助按钮：复制链接（如果跳转失败，可手动在微信打开） -->
    <button class="btn btn-secondary" id="copyBtn">📋 复制链接</button>

    <div id="statusMsg" class="status-msg"></div>

    <div class="note">
      <strong>提示：</strong>点击按钮后若未自动跳转，请选择“在浏览器中打开”或手动粘贴到微信。
      <div class="warn-text">
        <span>⚠️</span> 仅支持微信内打开，部分浏览器受限
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 原始目标链接（经过处理，可正常作为图片或页面打开）
      const TARGET_URL = 'https://qxer.jike.love/console/upload/eZuYBR6VG.png?imageView/w/500/q/h/Expires/1789459340';
      
      // 从链接中提取图片路径（用于显示，也保留完整链接用于跳转）
      const previewSpan = document.getElementById('previewUrl');
      if (previewSpan) {
        // 为了美观，只显示路径部分，但hover显示完整
        previewSpan.textContent = 'qxer.jike.love/.../eZuYBR6VG.png';
        previewSpan.title = TARGET_URL;
      }

      // 获取按钮和状态元素
      const jumpBtn = document.getElementById('jumpBtn');
      const copyBtn = document.getElementById('copyBtn');
      const statusMsg = document.getElementById('statusMsg');

      // 显示临时状态
      function showStatus(text, isSuccess = true) {
        statusMsg.textContent = text;
        statusMsg.style.color = isSuccess ? '#07C160' : '#e6a23c';
        // 3秒后清除
        if (window._statusTimer) clearTimeout(window._statusTimer);
        window._statusTimer = setTimeout(() => {
          statusMsg.textContent = '';
        }, 3000);
      }

      // 复制链接到剪贴板
      function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        } else {
          // 降级方案
          return new Promise((resolve, reject) => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
              const success = document.execCommand('copy');
              document.body.removeChild(textarea);
              success ? resolve() : reject(new Error('复制失败'));
            } catch (err) {
              document.body.removeChild(textarea);
              reject(err);
            }
          });
        }
      }

      // 判断是否在微信内置浏览器中
      function isWeChatBrowser() {
        const ua = navigator.userAgent.toLowerCase();
        return ua.indexOf('micromessenger') !== -1;
      }

      // 尝试跳转微信打开链接的通用方法
      function tryOpenInWeChat() {
        // 如果已经在微信内，则直接使用当前窗口打开目标链接
        if (isWeChatBrowser()) {
          showStatus('已在微信中，正在打开...', true);
          // 小延迟后跳转，让用户看到状态
          setTimeout(() => {
            window.location.href = TARGET_URL;
          }, 200);
          return;
        }

        // 非微信环境：尝试通过微信scheme唤起微信并打开
        // 注意：weixin:// 协议在大多数浏览器中无法直接携带参数打开网页
        // 这里使用通用做法：先复制链接，然后尝试打开微信，并提示用户粘贴
        // 同时，在部分安卓浏览器中，可以直接通过 scheme 打开微信
        // 但为了更好的用户体验，我们同时提供复制链接功能。

        // 先复制链接到剪贴板，方便用户在微信中粘贴
        copyToClipboard(TARGET_URL).then(() => {
          showStatus('链接已复制，正在尝试打开微信...', true);
        }).catch(() => {
          showStatus('请手动复制链接，然后到微信打开', false);
        });

        // 尝试通过 uri scheme 打开微信 (不同平台略有差异)
        // 注意: 直接在浏览器中打开 weixin:// 可能会被拦截，但这是常用尝试方案。
        const now = Date.now();
        const ua = navigator.userAgent.toLowerCase();
        const isAndroid = /android/.test(ua);
        const isIOS = /iphone|ipad|ipod/.test(ua);
        
        // 设定一个超时，如果页面没有隐藏（即没有跳转微信），则给出提示
        let hasHidden = false;
        const visibilityHandler = () => {
          if (document.hidden) {
            hasHidden = true;
          }
        };
        document.addEventListener('visibilitychange', visibilityHandler);

        // 针对不同平台尝试不同的 scheme
        // 常规: weixin:// 会尝试打开微信
        // 但更好的方式是通过 weixin://dl/business/?t=xxx 或者直接打开微信再手动进入
        // 为了通用性，我们只打开微信，引导用户粘贴
        
        // 使用隐藏的 iframe 或直接 location.href 来唤起
        // 但直接 location.href 会导致页面跳转走，所以我们使用 iframe 或 window.open 然后关闭
        // 更好的方式: 创建一个隐藏的 a 标签点击
        const tryScheme = (scheme) => {
          try {
            // 使用隐藏的 iframe 可以避免页面跳转，但可能被浏览器拦截
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = scheme;
            document.body.appendChild(iframe);
            setTimeout(() => {
              document.body.removeChild(iframe);
            }, 1000);
          } catch (e) {
            // 忽略
          }
        };

        // 尝试打开微信
        if (isAndroid) {
          // 安卓：通过 intent 或 scheme 尝试
          // 通用 scheme
          tryScheme('weixin://');
        } else if (isIOS) {
          // iOS: 使用通用 scheme
          tryScheme('weixin://');
        } else {
          // 桌面端：提示
          showStatus('请手动在微信中打开链接（已复制）', false);
        }

        // 延迟检查是否跳转成功
        setTimeout(() => {
          document.removeEventListener('visibilitychange', visibilityHandler);
          if (!document.hidden && !hasHidden) {
            // 页面未隐藏，说明可能没有成功唤起微信
            showStatus('若未打开微信，请手动粘贴链接打开', false);
          }
        }, 1800);
      }

      // 主按钮点击事件
      jumpBtn.addEventListener('click', function(e) {
        e.preventDefault();
        tryOpenInWeChat();
      });

      // 复制按钮点击事件
      copyBtn.addEventListener('click', function() {
        copyToClipboard(TARGET_URL).then(() => {
          showStatus('✅ 链接已复制，请到微信中粘贴打开', true);
        }).catch(() => {
          showStatus('❌ 复制失败，请手动长按复制', false);
        });
      });

      // 如果用户直接在微信中打开此页面，自动跳转到目标链接（可选）
      // 但为了避免干扰，这里不自动跳转，让用户点击按钮。但可以给个提示。
      if (isWeChatBrowser()) {
        // 如果在微信内，可修改按钮文案为“立即打开”
        jumpBtn.textContent = '🚀 立即打开';
        // 也可以自动跳转？为符合用户预期，保持点击跳转。
      }

      // 针对长按复制的额外处理：如果是微信内，点击复制按钮同样提示
      // 添加长按复制提示（可选）
      // 无额外操作

      // 确保复制按钮在微信内也能正常工作
      // 所有逻辑就绪

    })();
  </script>
</body>
</html>
