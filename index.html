<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打开微信</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #07C160;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
    }
    .btn:active {
      background: #06AD56;
    }
  </style>
</head>
<body>
  <a href="weixin://" class="btn">打开微信</a>
</body>
</html>
