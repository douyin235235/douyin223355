<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>微信打开引导</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      padding: 28px 24px 32px;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 16px;
      background: linear-gradient(145deg, #07C160, #05a84e);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 44px; height: 44px; fill: white; }
    h1 { font-size: 22px; font-weight: 600; color: #1f2e3d; margin-bottom: 8px; }
    .subhead { font-size: 15px; color: #6b7a8a; margin-bottom: 20px; line-height: 1.5; }
    
    /* 步骤说明区域 */
    .steps {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .step-item:last-child { margin-bottom: 0; }
    .step-num {
      flex-shrink: 0;
      width: 22px; height: 22px;
      background: #07C160;
      color: #fff;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
    }
    .step-text {
      font-size: 14px;
      color: #3b4c5e;
      line-height: 1.5;
      flex: 1;
    }
    .step-text strong { color: #07C160; }

    /* 链接展示框 */
    .link-box {
      background: #f0f4f9;
      border: 1px solid #e3e9f0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      word-break: break-all;
      font-size: 13px;
      font-family: monospace;
      color: #2f3e4e;
      text-align: left;
      position: relative;
    }
    .link-box .full-url {
      display: block;
      line-height: 1.4;
      max-height: 60px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .btn-primary {
      background: #07C160;
      color: #fff;
      box-shadow: 0 8px 18px -6px rgba(7,193,96,0.4);
      margin-bottom: 12px;
    }
    .btn-primary:active { background: #06ad56; }
    .btn-secondary {
      background: #fff;
      color: #07C160;
      border: 1.5px solid #07C160;
    }
    .btn-secondary:active { background: #e9f9f0; }

    .status {
      font-size: 14px;
      min-height: 22px;
      margin-top: 14px;
      color: #07C160;
    }
    .note {
      font-size: 13px;
      color: #8a9aa8;
      margin-top: 18px;
      line-height: 1.6;
      border-top: 1px solid #edf2f7;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M8.5 4C4.91 4 2 6.69 2 10c0 1.84.93 3.48 2.4 4.6-.15.72-.5 1.86-1.1 2.6-.1.12.02.29.17.26 1.17-.25 2.45-.9 3.2-1.47.57.15 1.2.24 1.83.24 3.59 0 6.5-2.69 6.5-6s-2.91-6-6.5-6zm-2.1 4.3c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm4.2 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/>
        <path d="M22 15.5c0-2.5-2.2-4.6-5-4.9v.4c0 .16-.01.32-.03.48 2.1.4 3.53 1.9 3.53 3.5 0 1.2-.8 2.3-2.1 3.1.1.45.35 1.2.8 1.7.1.1-.02.24-.14.2-.9-.2-1.9-.7-2.5-1.15-.44.12-.9.18-1.38.18-2.7 0-4.97-1.6-5.5-3.7-.2.02-.4.03-.6.03-.28 0-.55-.02-.82-.05.47 2.9 2.98 5.1 6.02 5.1.63 0 1.24-.1 1.8-.27.75.5 2 1.1 3.17 1.35.15.03.27-.14.17-.26-.6-.74-.95-1.88-1.1-2.6 1.48-1.12 2.4-2.76 2.4-4.6z"/>
      </svg>
    </div>
    <h1>请在微信中打开</h1>
    <p class="subhead">由于浏览器限制，需按以下步骤操作</p>

    <!-- 清晰的步骤说明 -->
    <div class="steps">
      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-text">点击下方 <strong>“复制链接”</strong> 按钮</div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div class="step-text">打开 <strong>微信</strong>，进入任意聊天窗口</div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div class="step-text">在输入框 <strong>长按粘贴</strong> 并发送，然后点击链接打开</div>
      </div>
    </div>

    <!-- 显示完整链接（方便长按复制） -->
    <div class="link-box">
      <span class="full-url" id="fullUrl">https://qxer.jike.love/console/upload/eZuYBR6VG.png?imageView/w/500/q/h/Expires/1789459340</span>
    </div>

    <!-- 操作按钮 -->
    <button class="btn btn-primary" id="copyBtn">📋 复制链接</button>
    <button class="btn btn-secondary" id="openWechatBtn">💬 打开微信</button>

    <div class="status" id="statusMsg"></div>

    <div class="note">
      提示：如果您已在微信中，请直接长按上方链接选择“在浏览器中打开”即可。
    </div>
  </div>

  <script>
    (function() {
      const TARGET_URL = 'https://qxer.jike.love/console/upload/eZuYBR6VG.png?imageView/w/500/q/h/Expires/1789459340';
      const statusMsg = document.getElementById('statusMsg');
      const copyBtn = document.getElementById('copyBtn');
      const openWechatBtn = document.getElementById('openWechatBtn');

      // 显示状态提示
      function showStatus(text, isSuccess = true) {
        statusMsg.textContent = text;
        statusMsg.style.color = isSuccess ? '#07C160' : '#e6a23c';
        if (window._timer) clearTimeout(window._timer);
        window._timer = setTimeout(() => { statusMsg.textContent = ''; }, 3000);
      }

      // 复制到剪贴板（兼容方案）
      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise((resolve, reject) => {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy') ? resolve() : reject(new Error('复制失败'));
          } catch (e) {
            reject(e);
          } finally {
            document.body.removeChild(ta);
          }
        });
      }

      // 复制按钮点击
      copyBtn.addEventListener('click', function() {
        copyText(TARGET_URL).then(() => {
          showStatus('✅ 链接已复制！请打开微信粘贴给好友或文件传输助手');
        }).catch(() => {
          showStatus('❌ 复制失败，请长按上方链接手动复制', false);
        });
      });

      // 打开微信按钮（仅尝试唤起微信App，不打开特定链接）
      openWechatBtn.addEventListener('click', function() {
        const ua = navigator.userAgent.toLowerCase();
        const isWeChat = ua.indexOf('micromessenger') !== -1;
        
        if (isWeChat) {
          showStatus('您已在微信中，请长按上方链接选择“在浏览器中打开”');
          return;
        }

        // 尝试通过 scheme 打开微信（不携带参数，仅打开App）
        // 注意：这在部分浏览器仍可能被拦截，但这是目前最可行的方案
        const now = Date.now();
        const scheme = 'weixin://';
        
        // 使用 iframe 尝试唤起（比 location.href 更不易被拦截）
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = scheme;
        document.body.appendChild(iframe);
        
        // 清理 iframe
        setTimeout(() => {
          document.body.removeChild(iframe);
        }, 1000);

        // 提示用户
        showStatus('正在尝试打开微信... 若未跳转，请手动打开微信粘贴链接', false);
      });

      // 页面加载时，如果已经在微信内，可以自动选中链接方便用户复制
      if (navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1) {
        // 在微信内，选中链接文本方便用户复制
        const urlSpan = document.getElementById('fullUrl');
        if (urlSpan) {
          const range = document.createRange();
          range.selectNodeContents(urlSpan);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
    })();
  </script>
</body>
</html>
