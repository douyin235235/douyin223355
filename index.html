<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扫码跳转微信</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .qrcode-img {
            width: 80%;
            max-width: 320px;
            height: auto;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        .btn {
            display: block;
            width: 90%;
            max-width: 360px;
            padding: 16px 0;
            margin-bottom: 16px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: #e60012;
            background-color: #ffffff;
            border: 1px solid #e60012;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background-color: #fff5f5; }
    </style>
</head>
<body>

    <img class="qrcode-img" src="https://i.postimg.cc/bJNn9WhB/qrcode-wx6b6c1b15ec6acb4e-customer-21891.jpg" alt="二维码">

    <button class="btn" onclick="takeScreenshot()">按住图片保存到相册</button>

    <button class="btn" onclick="openWeChatScan()">点击这里打开微信扫一扫</button>

    <script>
        function takeScreenshot() {
            alert("请使用手机系统自带的截屏功能（通常是同时按电源键+音量减键）保存此二维码。");
        }

        function openWeChatScan() {
            var weixinScheme = "weixin://scanqrcode";
            window.location.href = weixinScheme;
            setTimeout(function() {
                if (!document.hidden) {
                    alert("如果无法跳转，请尝试：\n1. 长按上方二维码保存。\n2. 打开微信扫一扫从相册识别。");
                }
            }, 2000);
        }
    </script>

</body>
</html>
