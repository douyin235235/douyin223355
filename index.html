<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码保存工具</title>
    <!-- 引入 html2canvas 库用于截图 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #808080; /* 灰色背景 */
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 截图区域容器 */
        #capture-area {
            background-color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px; 
            box-sizing: border-box;
        }

        /* 图片样式 */
        .qr-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        /* 按钮通用样式 */
        .action-btn {
            width: 100%;
            max-width: 350px;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            color: #e74c3c; /* 红色字体 */
            background-color: #fff; 
            border: 2px solid #e74c3c; /* 红色边框 */
        }

        .action-btn:active {
            opacity: 0.7;
            background-color: #fce8e6;
        }
    </style>
</head>
<body>

    <!-- 这是将被截图保存的区域 -->
    <div id="capture-area">
        <!-- 注意这里改成了本地图片路径。请确保图片已上传到同一目录，且名字一致 -->
        <img src="qrcode.jpg" alt="扫码图" class="qr-image" id="qrImg">
        
        <button class="action-btn" id="btn-save">点击这里截图</button>
        <button class="action-btn" id="btn-wechat">点击这里打开微信扫一扫</button>
    </div>

    <script>
        // 1. 截图保存功能
        document.getElementById('btn-save').addEventListener('click', function() {
            const element = document.getElementById('capture-area');
            const btn = this;
            
            const originalText = btn.innerText;
            btn.innerText = "正在生成...";
            btn.disabled = true;

            html2canvas(element, {
                scale: 2, 
                useCORS: true, 
                backgroundColor: "#ffffff" 
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                
                const link = document.createElement('a');
                link.download = '扫码图片_' + new Date().getTime() + '.png';
                link.href = imgData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                btn.innerText = originalText;
                btn.disabled = false;
                alert("图片已保存，请到相册查看！");
            }).catch(err => {
                console.error("截图失败:", err);
                btn.innerText = originalText;
                btn.disabled = false;
                alert("截图失败，请重试");
            });
        });

        // 2. 打开微信功能
        document.getElementById('btn-wechat').addEventListener('click', function() {
            const weixinScheme = 'weixin://';
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile) {
                window.location.href = weixinScheme;
            } else {
                alert("请在手机端打开此页面使用微信功能。");
            }
        });
    </script>
</body>
</html>
